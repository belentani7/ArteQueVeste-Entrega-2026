<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arte Que Veste — Créditos</title>
<meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background-color: #F4E7D3;
            background-image: url('https://www.transparenttextures.com/patterns/natural-paper.png');
            color: #2E1104;
            font-family: 'Open Sans', sans-serif;
            border: 20px solid #4A2311;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .visual-center {
            border: 5px solid #4A2311;
            height: 420px;
            width: 280px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }
        .closing-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .credits-section {
            text-align: center;
            max-width: 800px;
        }
        .brand-title {
            font-family: 'Playfair Display', serif;
            font-size: 48px;
            font-weight: 800;
            color: #4A2311;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        .dashed-divider {
            width: 200px;
            border-top: 2px dashed #4A2311;
            margin: 15px auto;
        }
        .legal-notice {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 15px;
        }
        .creator-credit {
            font-family: 'Montserrat', sans-serif;
            font-size: 16px;
            color: #4A2311;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 700;
        }
        .owner-credit {
            font-size: 14px;
            margin-top: 5px;
            color: #4A2311;
            font-weight: 600;
        }
        .location {
            margin-top: 15px;
            font-size: 14px;
            font-style: italic;
        }
    
/* Responsive reading mode; original 1280px presentation remains unchanged. */
@media (max-width: 1279px) {
  .slide-container { box-sizing:border-box; width:100%; min-height:100vh; height:auto; border-width:8px; overflow-wrap:anywhere; }
  .header { padding:24px 16px 0; }
  .main-content { display:flex; flex-direction:column; padding:16px; gap:16px; }
  .image-frame, .image-container, .visual-center { box-sizing:border-box; width:min(100%,400px); height:auto; aspect-ratio:4 / 5; margin-inline:auto; }
  .slide-container img { max-width:100%; }
  .main-title { font-size:clamp(2rem,8vw,5rem); letter-spacing:.04em; }
  .chapter-title, .brand-title { font-size:clamp(1.5rem,6vw,3rem); }
  .subtitle { font-size:clamp(1rem,4vw,2rem); padding:10px; margin-bottom:24px; }
  .text-content, .text-overlay, .credits-section { min-width:0; max-width:100%; }
  .slide-container p, .slide-container li { font-size:clamp(1rem,2.5vw,1.25rem)!important; }
  .financial-table { display:block; overflow-x:auto; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration:0.01ms!important; transition-duration:0.01ms!important; scroll-behavior:auto!important; }
}
</style>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@800&family=Montserrat:wght@700&family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="slide-container">
        <div class="visual-center">
            <img src="../imagenes/image_1782173087065.jpeg" class="closing-image" alt="Arte Que Veste - Essência">
        </div>
        <div class="credits-section">
            <h2 class="brand-title">Arte Que Veste</h2>
            <div class="dashed-divider"></div>
            <p class="legal-notice">
                Todos os direitos reservados à marca original.<br>
                Este manual é um guia estratégico de implantação e gestão.
            </p>
            <p class="creator-credit">
                Visão Conceitual e Visual: Pedro Belentani
            </p>
            <p class="owner-credit">
                Titular: Jhon Assis (Jhon Assis Ateliê)
            </p>
            <p class="location">
                Aracaju, Sergipe, Brasil — 2026
            </p>
        </div>
    </div>

<!-- FRONT-UPGRADE: Lenis + GSAP -->
<script src="https://unpkg.com/lenis@1.1.14/dist/lenis.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/ScrollTrigger.min.js"></script>
<script>
(function(){try{
if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
if(window.Lenis){var l=new Lenis({duration:1.1});var r=function(t){l.raf(t);requestAnimationFrame(r)};requestAnimationFrame(r);}
if(window.gsap&&window.ScrollTrigger){gsap.registerPlugin(ScrollTrigger);
document.querySelectorAll('section,h1,h2,.card,img').forEach(function(el){
gsap.from(el,{opacity:0,y:26,duration:0.8,ease:'power2.out',scrollTrigger:{trigger:el,start:'top 90%'}});
});
}}catch(e){}})();
</script>
</body>
</html>

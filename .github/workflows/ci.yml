name: CI (static slides)
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  slides:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify slide assets, mobile CSS and reduced motion
        run: |
          node --version
          node --test tests/slides-assets.test.cjs

# generated by belentani_omega - safe to overwrite
name: CI (static)
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: static site sanity check
        run: |
          if [ -f index.html ]; then
            test -s index.html
          else
            echo "No root index.html; nothing to validate."
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verificación de protocolos
        run: test -f README.md && test -f LICENSE && test -f .gitignore
      - name: Tests (node:test)
        run: node --test test/
